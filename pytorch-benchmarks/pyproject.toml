[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-benchmarks"
version = "0.1.0"
description = "Native Python PyTorch training and inference benchmark harness."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Reporting/run-regression-bench.py, the client that times both regression APIs.
bench = ["requests>=2.31"]

[project.scripts]
pytorch-bench = "pytorch_benchmarks.__main__:main"
pytorch-bench-api = "pytorch_benchmarks.server:main"

[tool.setuptools.packages.find]
where = ["src"]
